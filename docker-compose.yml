services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hugyou
      MYSQL_USER: hugyou
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      # Persists the database across restarts and redeploys.
      - db-data:/var/lib/mysql
    healthcheck:
      # Over TCP on purpose: while MySQL sets up a fresh volume it only listens
      # on its socket, so this stays unhealthy until the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db;Database=hugyou;User=hugyou;Password=${MYSQL_PASSWORD}"
    depends_on:
      # The backend creates/updates the tables on startup, so MySQL has to be ready.
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # No published port: traffic comes in through the Cloudflare Tunnel.
    # For direct LAN access on a free host port add e.g.  ports: ["9900:80"]
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Put the token in a .env file next to this file (git-ignored):
      #   TUNNEL_TOKEN=eyJ...
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - frontend

volumes:
  db-data:
