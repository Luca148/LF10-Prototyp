# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: HugYou Unit Test

on:
  push:
    branches: 
      - main
      - backend
  pull_request:
    branches: [ "Main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7

      - name: .NET install
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The solution holds both test projects (filter and API); neither needs MySQL.
      - name: Restore
        run: dotnet restore backend/LF10.Api/LF10.Api.slnx

      - name: Build
        run: dotnet build backend/LF10.Api/LF10.Api.slnx --configuration Release --no-restore

      - name: Tests Execution
        run: dotnet test backend/LF10.Api/LF10.Api.slnx --no-build --configuration Release --logger "console;verbosity=normal"
