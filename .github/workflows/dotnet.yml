# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: HugYou Unit Test

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v3

      - name: .NET install
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/HarassmentFilter.Test/HarassmentFilter.Test.csproj

      - name: Build
        run: dotnet build backend/HarassmentFilter.Test/HarassmentFilter.Test.csproj --configuration Release --no-restore

      - name: Tests Execution
        run: dotnet test backend/HarassmentFilter.Test/HarassmentFilter.Test.csproj --no-build --configuration Release --logger "console;verbosity=normal"
